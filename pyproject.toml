[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tracer"
version = "0.1.0"
description = "Record every step an LLM agent takes as OpenTelemetry traces."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.optional-dependencies]
dev = ["pytest"]
anthropic = ["anthropic"]

[tool.setuptools]
packages = ["agent_tracer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
